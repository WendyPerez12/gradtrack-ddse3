services:
  postgres:
    image: postgres:16-alpine
    container_name: gradtrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gradtrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gradtrack_dev}
      POSTGRES_DB: ${POSTGRES_DB:-gradtrack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gradtrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gradtrack} -d ${POSTGRES_DB:-gradtrack}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gradtrack_pgdata:
